interface_contracts:
    - name: Renaming Rules
      description: |
        All agents apply the same substitution rules consistently.
        These are the binding rules for all agents.
      definition: |
        Runtime artifact filenames:
          .saw-ownership.json    -> .polywave-ownership.json
          .saw-journal.jsonl     -> .polywave-journal.jsonl
          .saw-worktree-env      -> .polywave-worktree-env
          .saw-state/            -> .polywave-state/
          .saw-agent-brief.md    -> .polywave-agent-brief.md

        Branch naming:
          saw/{slug}/            -> polywave/{slug}/

        Skill paths:
          ~/.claude/skills/saw/  -> ~/.claude/skills/polywave/
          ~/.agents/skills/saw/  -> ~/.agents/skills/polywave/

        Commands:
          /saw                   -> /polywave (skill command)

        Variable names:
          saw_label              -> polywave_label

        Schema:
          "SAW IMPL Manifest"   -> "Polywave IMPL Manifest"

        Prose:
          "SAW" (system name)    -> "Polywave"

        Hook filenames in docs:
          saw-worktree-boundary.sh  -> polywave-worktree-boundary.sh
          saw-critic-impl-commit.sh -> polywave-critic-impl-commit.sh

        SVG paths in README.md:
          saw-scout-wave-dark.svg   -> polywave-scout-wave-dark.svg
          saw-scout-wave-light.svg  -> polywave-scout-wave-light.svg

        Repo example names in prose:
          saw-engine  -> polywave-engine (or polywave-go)
          saw-web     -> polywave-web

        EXCLUSIONS (do NOT change):
          - CHANGELOG.md
          - docs/IMPL/complete/ directory
          - docs/lsp-case-study.md
          - scripts/migrate-*.sh, scripts/validate-rebrand.sh
          - git history
          - SVG/drawio binary content
      location: docs/IMPL/IMPL-polywave-rebrand-completion.yaml
